<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunmore Photo Studio - Reservasi Online</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            oceanBg: '#E6F3FF',
            oceanCard: 'rgba(255, 255, 255, 0.75)',
            oceanPrimary: '#1E517B',
            oceanBlue: '#60A5FA',
            oceanSoft: '#CFE8FF',
            cutePink: '#FFD1DC',
            ctaCoral: '#FF7F67'
          },
          fontFamily: {
            poppins: ['Poppins', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #E6F3FF; font-family: 'Poppins', sans-serif; color: #1E517B; }
    .glassmorphism {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body x-data="bookingApp()" x-init="initApp()" class="min-h-screen pb-12">

  <!-- HEADER COMPACT -->
  <header class="sticky top-0 z-40 glassmorphism shadow-sm px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-oceanSoft to-cutePink flex items-center justify-center font-bold text-xl text-oceanPrimary shadow-sm">
        S
      </div>
      <div>
        <h1 class="text-base font-bold leading-tight text-oceanPrimary">Sunmore Studio</h1>
        <p class="text-xs text-gray-500">Wedomartani, Sleman</p>
      </div>
    </div>
    <span class="px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700 border border-green-300">
      ● OPEN
    </span>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-6">

    <!-- HERO BANNER -->
    <div class="relative rounded-2xl overflow-hidden shadow-md glassmorphism p-4 text-center">
      <h2 class="text-lg font-bold text-oceanPrimary">Abadikan Momen Terbaikmu ✨</h2>
      <p class="text-xs text-gray-600 mt-1">Reservasi mandiri cepat, mudah, dan langsung terkonfirmasi.</p>
    </div>

    <!-- STEP 1: KATALOG PRODUK -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-oceanPrimary">1. Pilih Paket Foto</h3>
        <span class="text-xs text-gray-500" x-text="selectedProduct ? selectedProduct.nama : 'Belum dipilih'"></span>
      </div>

      <!-- KATALOG CARD (GLASSMORPHISM) -->
      <div class="grid grid-cols-1 gap-3 max-h-80 overflow-y-auto pr-1">
        <template x-for="p in products" :key="p.kode">
          <div @click="selectProduct(p)" 
               :class="selectedProduct && selectedProduct.kode === p.kode ? 'ring-2 ring-oceanBlue bg-white' : 'glassmorphism'"
               class="p-3 rounded-xl shadow-sm cursor-pointer transition transform active:scale-98 flex justify-between items-center">
            <div>
              <span class="text-xs font-semibold px-2 py-0.5 rounded bg-cutePink/50 text-oceanPrimary" x-text="p.kode"></span>
              <h4 class="text-sm font-bold text-oceanPrimary mt-1" x-text="p.nama"></h4>
              <p class="text-xs text-gray-500">Durasi: <span x-text="p.durasi"></span> Menit</p>
            </div>
            <div class="text-right">
              <p class="text-xs text-gray-400 line-through">Full</p>
              <p class="text-sm font-bold text-ctaCoral">Rp <span x-text="Number(p.hargaFull).toLocaleString('id-ID')"></span></p>
              <span class="text-[10px] bg-oceanSoft text-oceanPrimary px-2 py-0.5 rounded-full font-medium">DP Rp <span x-text="Number(p.hargaDP).toLocaleString('id-ID')"></span></span>
            </div>
          </div>
        </template>
      </div>
    </section>

    <!-- STEP 2: KALENDER & TIME SLOT PICKER -->
    <section x-show="selectedProduct" class="space-y-3 glassmorphism p-4 rounded-2xl shadow-sm">
      <h3 class="text-sm font-bold text-oceanPrimary">2. Pilih Tanggal & Jam Foto</h3>
      
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Tanggal Foto</label>
        <input type="date" x-model="bookingDate" @change="generateTimeSlots()" 
               class="w-full text-xs p-2.5 rounded-xl border border-oceanSoft focus:ring-2 focus:ring-oceanBlue outline-none bg-white/80">
      </div>

      <div x-show="bookingDate">
        <label class="block text-xs font-medium text-gray-700 mb-1">Pilihan Jam Available (+5m buffer)</label>
        <div class="grid grid-cols-4 gap-2">
          <template x-for="slot in timeSlots" :key="slot.time">
            <button @click="if(!slot.booked) selectedTime = slot.time"
                    :disabled="slot.booked"
                    :class="{
                      'bg-gray-200 text-gray-400 cursor-not-allowed line-through': slot.booked,
                      'bg-ctaCoral text-white font-bold shadow-md': selectedTime === slot.time,
                      'bg-white text-oceanPrimary border border-oceanSoft': !slot.booked && selectedTime !== slot.time
                    }"
                    class="py-2 text-xs rounded-xl transition text-center">
              <span x-text="slot.time"></span>
            </button>
          </template>
        </div>
      </div>
    </section>

    <!-- STEP 3: DATA DIRI & CRM FORM -->
    <section x-show="selectedProduct && selectedTime" class="space-y-3 glassmorphism p-4 rounded-2xl shadow-sm">
      <h3 class="text-sm font-bold text-oceanPrimary">3. Lengkapi Data Booking</h3>

      <div class="space-y-2 text-xs">
        <div>
          <label class="block text-gray-700 font-medium mb-1">Kampus / Instansi</label>
          <select x-model="form.kampus" class="w-full p-2.5 rounded-xl border border-oceanSoft bg-white outline-none">
            <option value="">-- Pilih Kampus / Instansi --</option>
            <template x-for="k in kampusList" :key="k.singkatan">
              <option :value="k.singkatan" x-text="`${k.singkatan} - ${k.namaResmi}`"></option>
            </template>
          </select>
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-1">Nama Lengkap</label>
          <input type="text" x-model="form.nama" placeholder="Contoh: Budi Santoso" class="w-full p-2.5 rounded-xl border border-oceanSoft bg-white outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-700 font-medium mb-1">No. WhatsApp</label>
            <input type="number" x-model="form.wa" placeholder="08123456789" class="w-full p-2.5 rounded-xl border border-oceanSoft bg-white outline-none">
          </div>
          <div>
            <label class="block text-gray-700 font-medium mb-1">Email</label>
            <input type="email" x-model="form.email" placeholder="budi@gmail.com" class="w-full p-2.5 rounded-xl border border-oceanSoft bg-white outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-700 font-medium mb-1">Kota Asal (KTP)</label>
            <input type="text" x-model="form.kotaKtp" placeholder="Jakarta" class="w-full p-2.5 rounded-xl border border-oceanSoft bg-white outline-none">
          </div>
          <div>
            <label class="block text-gray-700 font-medium mb-1">Domisili Jogja</label>
            <input type="text" x-model="form.domisiliJogja" placeholder="Seturan" class="w-full p-2.5 rounded-xl border border-oceanSoft bg-white outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-700 font-medium mb-1">Akun Instagram/TikTok</label>
            <input type="text" x-model="form.sosmed" placeholder="@budisantoso" class="w-full p-2.5 rounded-xl border border-oceanSoft bg-white outline-none">
          </div>
          <div>
            <label class="block text-gray-700 font-medium mb-1">Jumlah Personil Foto</label>
            <input type="number" x-model="form.jumlahOrang" value="1" class="w-full p-2.5 rounded-xl border border-oceanSoft bg-white outline-none">
          </div>
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-1">Tahu Sunmore dari Mana?</label>
          <select x-model="form.sumberMarketing" class="w-full p-2.5 rounded-xl border border-oceanSoft bg-white outline-none">
            <option value="Instagram">Instagram Ads / Feed</option>
            <option value="TikTok">TikTok</option>
            <option value="Teman">Rekomendasi Teman</option>
            <option value="Google">Google Search / Maps</option>
          </select>
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-1">Izin Rekam Video BTS (Konten)?</label>
          <select x-model="form.rekamBts" class="w-full p-2.5 rounded-xl border border-oceanSoft bg-white outline-none">
            <option value="YA">YA (Boleh)</option>
            <option value="TIDAK">TIDAK (Privat)</option>
          </select>
        </div>

        <!-- UPLOAD BUKTI TF -->
        <div class="pt-2 border-t border-oceanSoft">
          <label class="block text-gray-700 font-medium mb-1">Upload Bukti Transfer DP (BCA / DANA)</label>
          <input type="file" @change="handleFileUpload($event)" accept="image/*" class="w-full text-xs text-gray-500">
        </div>
      </div>
    </section>

    <!-- SUBMIT CTA BUTTON -->
    <div x-show="selectedProduct && selectedTime" class="pt-2">
      <button @click="submitBooking()" 
              :disabled="loading"
              class="w-full py-3.5 bg-ctaCoral hover:bg-orange-600 text-white font-bold rounded-2xl shadow-lg transition transform active:scale-95 flex justify-center items-center space-x-2">
        <span x-show="!loading">🚀 CONFIRM BOOKING & GET INVOICE</span>
        <span x-show="loading" class="animate-spin">🌀</span>
        <span x-show="loading">Memproses PDF...</span>
      </button>
    </div>

    <!-- MODAL SUCCESS / DUAL INVOICE OUTPUT -->
    <div x-show="successData" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 text-center shadow-2xl">
        <div class="w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto text-3xl">
          ✓
        </div>
        <h3 class="text-lg font-bold text-oceanPrimary">Booking Berhasil! 🎉</h3>
        <p class="text-xs text-gray-600">Kode Booking Anda: <br><b class="text-sm text-oceanBlue" x-text="successData.bookingId"></b></p>
        
        <div class="space-y-2 pt-2">
          <!-- CTA DOWNLOAD PDF -->
          <a :href="successData.pdfUrl" target="_blank" class="block w-full py-2.5 bg-oceanBlue text-white font-bold text-xs rounded-xl shadow">
            📄 Download PDF Invoice
          </a>
          <!-- CTA DIRECT WA -->
          <button @click="redirectToWA()" class="w-full py-2.5 bg-green-500 text-white font-bold text-xs rounded-xl shadow">
            💬 Konfirmasi ke WA Admin
          </button>
        </div>
      </div>
    </div>

  </main>

  <script>
    function bookingApp() {
      return {
        products: [],
        kampusList: [],
        bookedSlots: [],
        config: {},
        selectedProduct: null,
        bookingDate: '',
        selectedTime: '',
        timeSlots: [],
        loading: false,
        successData: null,
        form: {
          kampus: '', nama: '', wa: '', email: '', kotaKtp: '', domisiliJogja: '',
          sosmed: '', jumlahOrang: 1, sumberMarketing: 'Instagram', rekamBts: 'YA'
        },
        fileBase64: null,
        fileName: '',

        initApp() {
          google.script.run.withSuccessHandler(res => {
            this.config = res.config;
            this.products = res.products;
            this.kampusList = res.kampusList;
            this.bookedSlots = res.bookedSlots;
          }).getInitialData();
        },

        selectProduct(p) {
          this.selectedProduct = p;
          this.selectedTime = '';
          if(this.bookingDate) this.generateTimeSlots();
        },

        generateTimeSlots() {
          if(!this.bookingDate || !this.selectedProduct) return;
          let slots = [];
          let startHour = 9, endHour = 20; // Default operasional
          
          for(let h = startHour; h < endHour; h++) {
            for(let m of ['00', '30']) {
              let timeStr = `${String(h).padStart(2, '0')}:${m}`;
              // Check collision with bookedSlots
              let isBooked = this.bookedSlots.some(b => {
                return b.tanggal === this.bookingDate && b.jamMulai <= timeStr && b.jamSelesai > timeStr;
              });
              slots.push({ time: timeStr, booked: isBooked });
            }
          }
          this.timeSlots = slots;
        },

        handleFileUpload(e) {
          let file = e.target.files[0];
          if(!file) return;
          this.fileName = file.name;
          let reader = new FileReader();
          reader.onload = (evt) => { this.fileBase64 = evt.target.result; };
          reader.readAsDataURL(file);
        },

        submitBooking() {
          if(!this.form.nama || !this.form.wa || !this.form.kampus || !this.fileBase64) {
            alert("Mohon lengkapi Nama, WA, Kampus, dan Unggah Bukti Transfer DP!");
            return;
          }
          this.loading = true;
          let payload = {
            kodeProduk: this.selectedProduct.kode,
            namaPaket: this.selectedProduct.nama,
            durasiMenit: this.selectedProduct.durasi,
            hargaFull: this.selectedProduct.hargaFull,
            nominalDp: this.selectedProduct.hargaDP,
            tanggalFoto: this.bookingDate,
            jamFoto: this.selectedTime,
            kampusKode: this.form.kampus,
            kampusResmi: this.kampusList.find(k => k.singkatan === this.form.kampus)?.namaResmi || this.form.kampus,
            namaKlien: this.form.nama,
            noWhatsapp: this.form.wa,
            email: this.form.email,
            kotaKtp: this.form.kotaKtp,
            domisiliJogja: this.form.domisiliJogja,
            akunSosmed: this.form.sosmed,
            jumlahOrang: this.form.jumlahOrang,
            sumberMarketing: this.form.sumberMarketing,
            rekamBts: this.form.rekamBts,
            metodePembayaran: "BCA/DANA",
            buktiTfBase64: this.fileBase64,
            buktiTfFileName: this.fileName
          };

          google.script.run.withSuccessHandler(res => {
            this.loading = false;
            if(res.success) {
              this.successData = res;
            } else {
              alert(res.message);
            }
          }).processBooking(payload);
        },

        redirectToWA() {
          let text = `Halo Admin Sunmore Studio, saya telah melakukan reservasi mandiri:\n\n` +
                     `• *ID Booking:* ${this.successData.bookingId}\n` +
                     `• *Nama:* ${this.form.nama}\n` +
                     `• *Kampus:* ${this.form.kampus}\n` +
                     `• *Jadwal:* ${this.bookingDate} @ ${this.selectedTime} WIB\n` +
                     `• *Paket:* ${this.selectedProduct.nama}\n\n` +
                     `📄 *Link Invoice PDF:* ${this.successData.pdfUrl}\n\n` +
                     `Mohon konfirmasi dan validasi pembayarannya, terima kasih!`;
          let url = `https://wa.me/${this.successData.waNumber}?text=${encodeURIComponent(text)}`;
          window.open(url, '_blank');
        }
      }
    }
  </script>
</body>
</html>
